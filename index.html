 <style>
  /* =========================
     MOBILE-SAFE MODAL SYSTEM
  ========================= */

  .modal-safe {
    max-height: min(90dvh, calc(100vh - 2rem));
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;

    /* Safe areas (notch + home bar) */
    padding-top: env(safe-area-inset-top);
    padding-bottom: calc(env(safe-area-inset-bottom) + 5rem);
  }

  /* Prevent background scroll when modal open */
  body.modal-open {
    overflow: hidden;
    touch-action: none;
  }

  /* Mobile adjustments */
  @media (max-width: 640px) {
    .modal-safe {
      border-radius: 1.25rem !important;
      padding-left: 1rem !important;
      padding-right: 1rem !important;
    }
  }

  /* =========================
     SCROLL POLISH
  ========================= */
  .no-scrollbar::-webkit-scrollbar {
    display: none;
  }
  .no-scrollbar {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

  /* =========================
     PRINT
  ========================= */
  @media print {
    body {
      background: #fff !important;
      color: #000 !important;
    }
    .print-hidden {
      display: none !important;
    }
    .print-card {
      border: 1px solid #ddd !important;
      background: #fff !important;
    }
    .print-table th,
    .print-table td {
      padding: 10px !important;
    }
  }
/* =========================
   MATCHDAY LIVE ANIMATION
========================= */

@keyframes livePulse {
  0% {
    box-shadow: 0 0 0 0 rgba(57,255,20,0.6);
    transform: scale(1);
  }
  70% {
    box-shadow: 0 0 0 14px rgba(57,255,20,0);
    transform: scale(1.04);
  }

.mobile-tab-live {

  color: #39FF14 !important;
  border: 1px solid rgba(57,255,20,0.6);
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}

.animate-slideUp {
  animation: slideUp .25s ease-out;
}

.nav-btn {

/* =========================
  NAV MENU ITEMS
========================= */

  color: white;

/* overlay visible */

}

body.nav-lock {
  overflow: hidden;
}

/* ===============================
   MOBILE NAV POLISH (FIX-4)
   Desktop unaffected
================================ */

@media (max-width: 768px) {

  body.nav-open {
    overflow: hidden; /* lock background scroll */
  }

  #navOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;

  #navOverlay.show {

    top: 64px;

    z-index: 100;

    transform: translateY(-12px) scale(0.98);
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
  }

  #navMenu.open {
    transform: translateY(0) scale(1);
    opacity: 1;

  }

  .nav-item {
    width: 100%;

}

  inset: 0;

.toast-container {

  bottom: 1.5rem;

}

.toast {

}

/* ===== TOAST ALWAYS ON TOP ===== */
.toast-wrapper {

  bottom: 1.5rem;
  left: 50%;

}

  <!-- Firebase + App -->
  <script type="module">
    /* ============================================================
      PES ARENA — SINGLE FILE (NO BUILD)
      Replace ONLY firebaseConfig below, then deploy as static.
      ============================================================ */

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      updateProfile,
sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    import {
      getFirestore,
      collection,
      doc,
      getDoc,
getDocs, 
      setDoc,
      addDoc,
      updateDoc,
      deleteDoc,
      onSnapshot,
      query,

documentId ,
      increment,
      arrayUnion,
      arrayRemove
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    import {
      getDatabase,
      ref as rref,
      onValue,
      set as rset,
      onDisconnect,
      remove as rremove
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    /* =========================
       1) FIREBASE CONFIG

    ========================= */

const firebaseConfig = {
  apiKey: "AIzaSyDbeWlKGV9iN2ZJ3Ub52sZSM5DLzABezh4",
  authDomain: "efootball-78.firebaseapp.com",
  databaseURL: "https://efootball-78-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "efootball-78",

  messagingSenderId: "752411493506",
  appId: "1:752411493506:web:5c8d8a9141d23a8dfb609b",
  measurementId: "G-E4L1KSTXH7"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const rtdb = getDatabase(app);

    /* =========================
       2) UTIL
    ========================= */
    const $app = document.getElementById("app");

    const cn = (...c) => c.filter(Boolean).join(" ");
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
    const fmtDT = (ms) => {
      try { return new Date(ms).toLocaleString(); } catch { return ""; }
    };
    const now = () => Date.now();

   function toast(msg) {
  if (typeof msg !== "string") {
    console.warn("Toast received non-string:", msg);
    msg = "Something went wrong";
  }

  state.toast = msg;

  setTimeout(() => {
    state.toast = null;
    render();
  }, 2500);

  render();
}


    /* =========================
       3) GLOBAL STATE
    ========================= */
   const state = {
  // App
  booting: true,
  user: null,
  profile: null,
  authModalOpen: false,

  // Navigation
  globalTab: "Browse Tournaments",
  tournamentTab: "Home",
  activeTournamentId: null,

  // Core data
  tournaments: [],
  participants: [],
  matches: [],
 matchdays: [], 
matchChat: [], 

  // Announcements
  announcements: [],
inAdminPanel: false,
forgotPasswordSent: false,



  // SUPPORT (FINAL – no tickets, no channels)
    // SUPPORT (1-to-1: player <-> admin)
  supportThreads: [],       // admin sees player thread list
  supportMessages: [],  
 uiSupportReady: false, 
    // active chat messages
  uiSupportActiveId: null,  // playerUid selected by admin
  uiSupportAdminView: "threads", // "threads" | "chat"
myOwnedTournaments: [],
myJoinedTournamentIds: [],
myTournaments: [],


  // Presence (Realtime DB)
  presence: {},

  // UI flags
  showProfileEdit: false,
  showCreateTournament: false,
  showPaymentModal: false,
  paymentUTR: "",

  // Sponsor rotation
  sponsorIndex: 0,
  sponsorTimer: null,

  // Feedback
  toast: null,
  loadingAction: false
};


    const GLOBAL_TABS = [
  "Browse Tournaments",
  "My Tournaments",
  "Profile",
  ...(state.user && state.user.isPlatformAdmin ? ["Admin Panel"] : [])
];

    const TOURNEY_TABS = [
  "Home",
  "Players",
  "Standings",
  "Fixtures",
  "Bracket",
  "Announcements",
  "Support",
  ...(activeTournament() && isAdmin(activeTournament()) ? ["Admin"] : [])
];


    function isLoggedIn() {
      return !!state.user && !state.user.isAnonymous;
    }

    function activeTournament() {
      if (!state.activeTournamentId) return null;
      return state.tournaments.find(t => t.id === state.activeTournamentId) || null;
    }

    function isAdmin(t) {
      if (!t || !state.user) return false;
      return (t.ownerId === state.user.uid) || (Array.isArray(t.adminIds) && t.adminIds.includes(state.user.uid));
    }

function isRegistered(t) {
  if (!t || !state.user) return false;
  return Array.isArray(t.participants) && t.participants.includes(state.user.uid);
}

    function hasJoinedTournament(tid) {
  return state.myJoinedTournamentIds.includes(tid);
}
function getTournamentPlayerCount(t) {
  return state.participants.filter(p =>
    p.tournamentId === t.id &&
    ["pending", "approved"].includes(p.status)
  ).length;
}

function getEffectivePlayerCount(t) {
  if (!t?.id) return 0;

  // FREE tournament → count joined users
  if (t.type === "Free") {
    return state.participants.filter(p =>
      p.tournamentId === t.id &&
      p.status === "joined"
    ).length;
  }

  // PAID tournament → count approved users
  return state.participants.filter(p =>
    p.tournamentId === t.id &&
    p.status === "approved"
  ).length;
}




    function profileComplete() {
      return !!(state.profile && state.profile.isComplete);
    }

    /* =========================
       4) SUBSCRIPTIONS (clean)
    ========================= */
    const subs = {
      tournaments: null,
      profile: null,
      participants: null,
      matches: null,
 matchdays: null,
      announcements: null,
      support: null,
      presence: null,
myOwned: null,
  myJoined: null,
matchChat: null
    };

    function unsubscribeAllTournamentStreams() {
  ["participants", "matches", "matchdays", "announcements", "support", "presence"]
    .forEach(k => {
      if (subs[k]) {
        subs[k]();
        subs[k] = null;
      }
    });

  state.participants = [];
  state.matches = [];
  state.matchdays = [];      // ✅ ADD
  state.announcements = [];
}


    function clearSponsorTimer() {
      if (state.sponsorTimer) { clearInterval(state.sponsorTimer); state.sponsorTimer = null; }
      state.sponsorIndex = 0;
    }

    function startSponsorTimer(t) {
      clearSponsorTimer();
      const sponsors = Array.isArray(t?.sponsors) ? t.sponsors : [];
      const cfg = t?.sponsorConfig || {};
      const ms = Math.max(2000, Number(cfg.rotateMs || 4500));
      if (sponsors.length <= 1) return;
      state.sponsorTimer = setInterval(() => {
        state.sponsorIndex = (state.sponsorIndex + 1) % sponsors.length;
        render();
      }, ms);
    }

    function subscribeTournaments() {
      if (subs.tournaments) { subs.tournaments(); subs.tournaments = null; }
      if (!isLoggedIn()) return;

      const qT = query(collection(db, "tournaments"), orderBy("createdAt", "desc"), limit(200));
      subs.tournaments = onSnapshot(qT, (snap) => {
        state.tournaments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        // keep activeTournamentId valid
        if (state.activeTournamentId && !state.tournaments.some(t => t.id === state.activeTournamentId)) {
          state.activeTournamentId = null;
          state.tournamentTab = "Home";
          unsubscribeAllTournamentStreams();
        }
        render();
      }, () => {
        // If rules block it, still render UI
        render();
      });
    }

    function subscribeProfile(uid) {
      if (subs.profile) { subs.profile(); subs.profile = null; }
      if (!uid) return;

      const refP = doc(db, "users", uid);
      subs.profile = onSnapshot(refP, (snap) => {
        state.profile = snap.exists() ? snap.data() : null;
        render();
      });
    }
function isMatchdayLocked(matchdayNumber) {
  const md = state.matchdays.find(m => m.number === matchdayNumber);
  return md?.locked === true;
}

function getLiveMatchday() {
  return state.matchdays.find(m => m.started && !m.locked);
}


function subscribeMyTournaments() {
 if (subs.myOwned) { subs.myOwned(); subs.myOwned = null; }
  if (subs.myJoined) { subs.myJoined(); subs.myJoined = null; }
  if (!state.user) return;

  const uid = state.user.uid;

  // 🔹 A) tournaments I own
  const ownedQ = query(
    collection(db, "tournaments"),
    where("ownerId", "==", uid)
  );

  subs.myOwned = onSnapshot(ownedQ, snap => {
    state.myOwnedTournaments = snap.docs.map(d => ({
      id: d.id,
      ...d.data()
    }));
    mergeMyTournaments();
  });

  // 🔹 B) tournaments I joined (via participants)
  const joinedQ = query(
    collection(db, "participants"),
    where("userId", "==", uid)
  );

  subs.myJoined = onSnapshot(joinedQ, snap => {
    state.myJoinedTournamentIds = snap.docs.map(d => d.data().tournamentId);
    mergeMyTournaments();
  });
}

async function mergeMyTournaments() {
  const ids = new Set([
    ...state.myOwnedTournaments.map(t => t.id),
    ...state.myJoinedTournamentIds
  ]);

  if (ids.size === 0) {
    state.myTournaments = [];
    render();
    return;
  }

  // Fetch tournaments for joined IDs not already owned
  const missingIds = [...ids].filter(
    id => !state.myOwnedTournaments.find(t => t.id === id)
  );

  let joinedTournaments = [];

  if (missingIds.length > 0) {
    const chunks = [];
    while (missingIds.length) chunks.push(missingIds.splice(0, 10));

    for (const chunk of chunks) {
      const qy = query(
  collection(db, "tournaments"),
  where(documentId(), "in", chunk)
);


      const snap = await getDocs(qy);
      joinedTournaments.push(
        ...snap.docs.map(d => ({ id: d.id, ...d.data() }))
      );
    }
  }

  state.myTournaments = [
    ...state.myOwnedTournaments,
    ...joinedTournaments
  ];

  render();
}

   function subscribeTournamentStreams(tournamentId) {
  unsubscribeAllTournamentStreams();

  // Participants
  subs.participants = onSnapshot(
    query(collection(db, "participants"), where("tournamentId", "==", tournamentId)),
    snap => {
      state.participants = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }
  );

  // Matches
  subs.matches = onSnapshot(
    query(collection(db, "matches"), where("tournamentId", "==", tournamentId)),
    snap => {
      state.matches = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }
  );

  // ✅ MATCHDAYS (NEW)
  subs.matchdays = onSnapshot(
    query(collection(db, "matchdays"), where("tournamentId", "==", tournamentId)),
    snap => {
      state.matchdays = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (a.number || 0) - (b.number || 0));
      render();
    }
  );

  // Announcements
  subs.announcements = onSnapshot(
    query(
      collection(db, "tournaments", tournamentId, "announcements"),
      orderBy("createdAt", "desc")
    ),
    snap => {
      state.announcements = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }
  );
}


    /* =========================
       5) AUTH FLOW
    ========================= */
    onAuthStateChanged(auth, async (u) => {
      state.user = u || null;
      state.booting = false;

      if (!isLoggedIn()) {
        // hard stop (no data leakage)
        state.profile = null;
        state.tournaments = [];
        state.activeTournamentId = null;


        unsubscribeAllTournamentStreams();
        if (subs.tournaments) { subs.tournaments(); subs.tournaments=null; }
        if (subs.profile) { subs.profile(); subs.profile=null; }
        render();
        return;
      }

      subscribeProfile(u.uid);
      subscribeTournaments();
subscribeMyTournaments();
      render();
    });

    /* =========================
       6) CORE ACTIONS
    ========================= */
    async function authLogin(email, password) {
      state.loadingAction = true; render();
      try {
        await signInWithEmailAndPassword(auth, email, password);
        state.authModalOpen = false;
        toast("Logged in");
      } catch (e) {
        toast(e?.message || "Login failed");
      } finally {
        state.loadingAction = false; render();
      }
    }

    async function authSignup(name, email, password) {
      state.loadingAction = true; render();
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName: name });
        await setDoc(doc(db, "users", cred.user.uid), {
          playerName: name,
          gameName: "",
          mobile: "",
          gameId: "",
          upiId: "",
          platform: "Mobile",
          region: "South Asia",
          isComplete: false,
          createdAt: now()
        }, { merge:true });
        state.authModalOpen = false;
        toast("Account created");
      } catch (e) {
        toast(e?.message || "Signup failed");
      } finally {
        state.loadingAction = false; render();
      }
    }

    async function doLogout() {
      try { await signOut(auth); } catch {}
    }

    function enterTournament(id) {
  state.activeTournamentId = id;
  state.tournamentTab = "Home";

  subscribeTournamentStreams(id);

  const t = activeTournament();
  if (isAdmin(t)) {
    checkAndStartMatchdays(id);
    checkAndEndMatchdays(id);
  }

  render();
}




    function exitTournament() {
  state.activeTournamentId = null;
  state.tournamentTab = "Home";
  state.inAdminPanel = false; // 🔥 IMPORTANT
  unsubscribeAllTournamentStreams();
  render();
}


    async function saveProfile(form) {
      if (!state.user) return;
      const isComplete = !!(form.playerName && form.gameName && form.mobile && form.gameId && form.upiId);
      state.loadingAction = true; render();
      try {
        await setDoc(doc(db, "users", state.user.uid), {
          ...form,
          isComplete,
          updatedAt: now()
        }, { merge:true });

        // Also update auth displayName for presence & UI
        try {
          if (form.playerName && state.user.displayName !== form.playerName) {
            await updateProfile(auth.currentUser, { displayName: form.playerName });
          }
        } catch {}

        state.showProfileEdit = false;
        toast(isComplete ? "Profile verified" : "Profile saved");
      } catch (e) {
        toast(e?.message || "Profile save failed");
      } finally {
        state.loadingAction = false; render();
      }
    }

    async function createTournament(form) {
      if (!state.user) return;
      state.loadingAction = true; render();
      try {
        const ref = await addDoc(collection(db, "tournaments"), {
          ...form,
          ownerId: state.user.uid,
          organizerName: state.user.displayName || form.organizerName || "Organizer",
          status: "Registration Open",
          createdAt: now(),
          playerCount: 0,
          participants: [],
          adminIds: [],
          sponsors: form.sponsors || [],
          sponsorConfig: form.sponsorConfig || { rotateMs: 4500 }
        });
        state.showCreateTournament = false;
        toast("Tournament created");
        enterTournament(ref.id);
      } catch (e) {
        toast(e?.message || "Create failed");

    async function requestJoinTournament(t) {
  const uid = state.user?.uid;
  if (!uid) throw new Error("Not logged in");

  // 🔒 Prevent double join / apply
  const existing = state.participants.find(p =>
    p.userId === uid &&
    p.tournamentId === t.id &&
    ["pending", "approved", "joined"].includes(p.status)
  );

  if (existing) {
    throw new Error("You have already applied for this tournament");
  }

  // 🧾 Profile check
  if (!profileComplete()) {
    toast("Complete profile to join");
    state.globalTab = "Profile";
    state.showProfileEdit = true;
    exitTournament();
    render();
    return;
  }

  // 🚫 Registration closed checks
  const now = Date.now();
  const deadlinePassed = t.deadline && now > Number(t.deadline);

  if (t.status !== "Registration Open" || deadlinePassed) {
    toast("Registration closed");
    return;
  }

  // 🧮 SLOT CHECK — USE EFFECTIVE COUNT (NOT playerCount)
  const joinedCount = getEffectivePlayerCount(t);
  if (joinedCount >= Number(t.maxPlayers || 0)) {
    toast("Tournament full");
    return;
  }

  // 💰 PAID TOURNAMENT → PAYMENT FLOW
  if (t.type === "Paid" && Number(t.entryFee || 0) > 0) {
    state.showPaymentModal = true;
    state.paymentUTR = "";

    // ⏱️ payment window
    state.paymentExpiresAt = Date.now() + (5 * 60 * 1000);
    state.paymentSessionId = crypto.randomUUID();

    render();
    return;
  }

  // 🟢 FREE TOURNAMENT → JOIN IMMEDIATELY
  await addDoc(collection(db, "participants"), {
    tournamentId: t.id,
    userId: uid,
    status: "joined",              // ✅ CRITICAL FIX
    paymentStatus: "FREE",
    joinedAt: now(),
    createdAt: now()
  });

  toast("Successfully joined the tournament");
  render();




      await finalizeJoin(t, null);
    }

 async function finalizeJoin(t, utr) {
  if (!state.user || !t) return;

  const uid = state.user.uid;
  const pid = `${uid}_${t.id}`;

  // ⛔ FINAL SAFETY
  const exists = state.participants.find(p =>
  p.id === pid ||
  (p.userId === uid && p.tournamentId === t.id)
);


  if (exists) {
    toast("You have already applied or joined");
    state.showPaymentModal = false;

  if (t.type === "Paid") {

    if (!/^\d{12,22}$/.test(utr || "")) {

    toast(
      t.type === "Paid"

        : "Joined successfully"
    );

    state.showPaymentModal = false;
    state.paymentUTR = "";
    state.paymentExpiresAt = null;

  } catch (e) {
    toast(e.message || "Join failed");

    state.loadingAction = false;
    render();

}

    function roundRobinCircle(players) {
      // players = [{userId, playerName}]
      const ps = [...players];
      if (ps.length < 2) return [];
      if (ps.length % 2 !== 0) ps.push({ userId:"bye", playerName:"BYE" });
      const rounds = ps.length - 1;
      const half = ps.length / 2;
      const schedule = [];
      let order = 0;

      for (let r = 0; r < rounds; r++) {
        for (let i = 0; i < half; i++) {
          const A = ps[i];
          const B = ps[ps.length - 1 - i];
          if (A.userId !== "bye" && B.userId !== "bye") {
            schedule.push({
              order: order++,
              roundName: `Matchday ${r+1}`,
              playerAId: A.userId, playerAName: A.playerName,
              playerBId: B.userId, playerBName: B.playerName
            });
          }
        }
        // rotate (keep first fixed)
        ps.splice(1, 0, ps.pop());
      }
      return schedule;
    }

    async function generateLeagueFixtures(t) {
      if (!t) return;
      const confirmed = state.participants.filter(p => p.status === "approved");

      state.loadingAction = true; render();
      try {
        // prevent regen if matches exist
        if (state.matches.length > 0) {
          toast("Matches already exist");
          return;
        }

        const schedule = roundRobinCircle(confirmed.map(p => ({ userId: p.userId, playerName: p.playerName })));
        for (const m of schedule) {
          await addDoc(collection(db, "matches"), {
            tournamentId: t.id,
            order: m.order,
            roundName: m.roundName,
            status: "pending",
            playerAId: m.playerAId,
            playerAName: m.playerAName,
            playerBId: m.playerBId,
            playerBName: m.playerBName,
            score: { a: 0, b: 0 },
            readyA: false,

          });

async function checkAndStartMatchdays(tournamentId) {
  if (!state.user) return;

  const now = new Date();

  const q = query(
    collection(db, "matchdays"),
    where("tournamentId", "==", tournamentId),
    where("started", "==", false)
  );

  const snap = await getDocs(q);
  if (snap.empty) return;

  for (const docSnap of snap.docs) {
    const md = docSnap.data();
    const mdDate = md.date.toDate();

    // Matchday date has arrived
    if (mdDate <= now) {

      // 🔒 Run-once protection
      if (md.started === true) continue;

      // 1️⃣ Mark matchday started
      await updateDoc(doc(db, "matchdays", docSnap.id), {
        started: true,
        startedAt: serverTimestamp()
      });

      // 2️⃣ Create announcement
      await addDoc(
        collection(db, "tournaments", tournamentId, "announcements"),
        {
          type: "matchday_start",
          title: `Matchday ${md.number} Started`,
          message: `Matchday ${md.number} has started. Congratulations to all players!`,
          matchday: md.number,
          createdAt: serverTimestamp(),
          system: true
        }
      );

      console.log(`Matchday ${md.number} started automatically`);
    }
  }
}


async function checkAndEndMatchdays(tournamentId) {
  if (!state.user) return;

  const now = new Date();

  const mdSnap = await getDocs(
    query(
      collection(db, "matchdays"),
      where("tournamentId", "==", tournamentId),
      where("started", "==", true),
      where("locked", "==", false)
    )
  );

  for (const mdDoc of mdSnap.docs) {
    const md = mdDoc.data();
    const mdDate = md.date.toDate();

    // Matchday ended
    if (mdDate < now) {

      // Get all matches of this matchday
      const matchSnap = await getDocs(
        query(
          collection(db, "matches"),
          where("tournamentId", "==", tournamentId),
          where("matchday", "==", md.number)
        )
      );

      for (const mDoc of matchSnap.docs) {
        const m = mDoc.data();

        if (m.status === "confirmed") continue;

        let scoreA = 0, scoreB = 0;

        // 🟢 One ready → 3–0
        if (m.readyA && !m.readyB) {
          scoreA = 3;
        } else if (!m.readyA && m.readyB) {
          scoreB = 3;
        }
        // 🟡 Both ready or none → 0–0

        await updateDoc(doc(db, "matches", mDoc.id), {
          "score.a": scoreA,
          "score.b": scoreB,
          status: "confirmed",
          autoResolved: true,
          resolvedAt: serverTimestamp()
        });
      }

      // 🔒 Lock matchday
      await updateDoc(doc(db, "matchdays", mdDoc.id), {
        locked: true,
        lockedAt: serverTimestamp()
      });

      console.log(`Matchday ${md.number} auto-closed`);
    }
  }
}



    /* =========================
       7) STANDINGS (computed)
    ========================= */
    function computeStandings() {
      const ps = state.participants.filter(p => p.status === "approved");
      const rows = ps.map(p => ({
        userId: p.userId,
        name: p.playerName || "Player",
        p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0
      }));

      const confirmed = state.matches.filter(m => m.status === "confirmed");
      for (const m of confirmed) {
        const A = rows.find(r => r.userId === m.playerAId);
        const B = rows.find(r => r.userId === m.playerBId);
        if (!A || !B) continue;
        const sa = Number(m.score?.a ?? 0);
        const sb = Number(m.score?.b ?? 0);

        A.p++; B.p++;
        A.gf += sa; A.ga += sb;
        B.gf += sb; B.ga += sa;

        if (sa > sb) { A.w++; A.pts += 3; B.l++; }
        else if (sb > sa) { B.w++; B.pts += 3; A.l++; }
        else { A.d++; B.d++; A.pts += 1; B.pts += 1; }
      }
      for (const r of rows) r.gd = r.gf - r.ga;

      // sort PTS > GD > GF
      rows.sort((a,b) => (b.pts-a.pts) || (b.gd-a.gd) || (b.gf-a.gf) || (a.name.localeCompare(b.name)));
      return rows;
    }

 function JoinPanel(t, full) {
  const uid = state.user?.uid;

  const now = Date.now();
  const deadlinePassed = t.deadline && now > Number(t.deadline);

  const already = state.participants.find(p =>
    p.userId === uid &&
    p.tournamentId === t.id &&
    ["pending", "approved"].includes(p.status)
  );

  /* ===============================

  =============================== */
  if (already) {
    return `
      <div class="rounded-2xl px-8 py-6 text-center
        font-black uppercase tracking-[0.35em] text-[10px]
        bg-[#39FF14]/10 border border-[#39FF14]/30 text-[#39FF14]">
        ${
          already.status === "pending"
            ? "Application Submitted (Pending Approval)"
            : "Already Joined"
        }
      </div>
    `;
  }

  /* ===============================
     DEADLINE PASSED
  =============================== */
  if (deadlinePassed) {
    return `
      <div class="rounded-2xl px-8 py-6 text-center
        font-black uppercase tracking-[0.35em] text-[10px]
        bg-white/5 border border-white/10 text-red-400">
        Registration Closed
      </div>
    `;
  }

  /* ===============================
     REGISTRATION STATUS CLOSED
  =============================== */
  if (t.status !== "Registration Open") {
    return `
      <div class="rounded-2xl px-8 py-6 text-center
        font-black uppercase tracking-[0.35em] text-[10px]
        bg-white/5 border border-white/10 text-slate-500">
        Registration Closed
      </div>
    `;
  }

  /* ===============================
     TOURNAMENT FULL
  =============================== */
  if (full) {
    return `
      <div class="rounded-2xl px-8 py-6 text-center
        font-black uppercase tracking-[0.35em] text-[10px]
        bg-white/5 border border-white/10 text-slate-500">

      </div>
    `;
  }

  /* ===============================
     PROFILE INCOMPLETE
  =============================== */
  if (!profileComplete()) {
    return `
      <div class="rounded-[2rem] border border-orange-500/20 bg-orange-500/5 p-8 text-center space-y-4">
        <div class="text-orange-400 font-black uppercase tracking-[0.35em] text-[10px]">

                 font-black uppercase tracking-widest text-[10px]">
          Complete Profile
        </button>
      </div>
    `;
  }

  /* ===============================
     JOIN ALLOWED
  =============================== */
  return `
    <div class="text-center space-y-5">
      <div class="text-slate-400 font-bold">
        You are not registered in this tournament.
      </div>

      <button
        data-action="joinTournament"
        class="px-12 py-6 rounded-2xl bg-[#39FF14] text-black
               font-black uppercase tracking-[0.35em] text-[11px]
               shadow-[0_0_35px_rgba(57,255,20,0.25)]
               hover:scale-[1.02] transition-transform">
        Join ${t.type === "Paid" ? `(INR ${Number(t.entryFee || 0)})` : ""}
      </button>
    </div>
  `;
}

    function TabBracket(t) {
      // basic bracket from matches with roundName not "Matchday X" (if knockout exists later)
      const knockout = state.matches.filter(m => m.roundName && !String(m.roundName).startsWith("Matchday"));
      if (!knockout.length) {
        return `
          <div class="rounded-[2.5rem] border border-white/10 bg-[#0a0a0a] p-10 shadow-2xl">
            <div class="border-l-4 border-[#39FF14] pl-6">
              <h2 class="text-3xl font-black italic uppercase tracking-tighter">Bracket</h2>
              <p class="text-[10px] font-black uppercase tracking-[0.35em] text-slate-500 mt-2">Knockout view</p>
            </div>
            <div class="mt-10 text-slate-600 font-black uppercase tracking-widest text-[10px]">
              No knockout rounds available (League tournaments may not have bracket).
            </div>
          </div>
        `;
      }

      const grouped = {};
      for (const m of knockout) {
        grouped[m.roundName] = grouped[m.roundName] || [];
        grouped[m.roundName].push(m);
      }
      const rounds = Object.keys(grouped);

      return `
        <div class="space-y-8">
          <div class="flex items-end justify-between border-l-4 border-[#39FF14] pl-6 print-hidden">
            <div>
              <h2 class="text-3xl font-black italic uppercase tracking-tighter">Bracket</h2>
              <p class="text-[10px] font-black uppercase tracking-[0.35em] text-slate-500 mt-2">Knockout view</p>
            </div>
            <button data-action="print" class="px-6 py-3 rounded-xl border border-white/10 bg-white/5 text-slate-200 font-black uppercase tracking-widest text-[10px] hover:bg-[#39FF14] hover:text-black transition-all">
              ${Icon("download","w-4 h-4 inline-block -mt-0.5 mr-2")}Export PDF
            </button>
          </div>

          <div class="rounded-[2.5rem] border border-white/10 bg-[#0a0a0a] p-6 shadow-2xl overflow-x-auto no-scrollbar print-card">
            <div class="flex gap-10 min-w-max">
              ${rounds.map(rn => `
                <div class="w-[320px] space-y-4">
                  <div class="text-center text-[10px] font-black uppercase tracking-[0.5em] text-[#39FF14]">${esc(rn)}</div>
                  <div class="space-y-4">
                    ${grouped[rn].map(m => `
                      <div class="rounded-2xl border border-white/10 bg-white/5 p-5">
                        <div class="flex items-center justify-between">
                          <div class="${cn("font-black uppercase italic truncate", (m.status==="confirmed" && Number(m.score?.a||0) > Number(m.score?.b||0)) ? "text-[#39FF14]" : "text-white")}">${esc(m.playerAName)}</div>
                          <div class="font-black italic text-lg text-white">${m.status==="confirmed" ? Number(m.score?.a||0) : "-"}</div>
                        </div>
                        <div class="mt-3 pt-3 border-t border-white/10 flex items-center justify-between">
                          <div class="${cn("font-black uppercase italic truncate", (m.status==="confirmed" && Number(m.score?.b||0) > Number(m.score?.a||0)) ? "text-[#39FF14]" : "text-white")}">${esc(m.playerBName)}</div>
                          <div class="font-black italic text-lg text-white">${m.status==="confirmed" ? Number(m.score?.b||0) : "-"}</div>
                        </div>
                      </div>
                    `).join("")}
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function TabAnnouncements(t) {
  const canPost = isAdmin(t);

  // 🧠 Unified text resolver
  const getText = (a) =>
    (a?.text ?? a?.content ?? a?.message ?? "").toString();

  // 🕒 Unified time resolver
  const getTime = (a) => {
    if (a?.createdAtMs) return new Date(a.createdAtMs);
    if (a?.createdAt?.toDate) return a.createdAt.toDate();
    return null;
  };

  return `
    <div class="space-y-6">

      ${canPost ? `
        <div class="rounded-2xl border border-white/10 bg-[#0a0a0a] p-6">
          <textarea id="announcementText"
            class="w-full h-28 bg-black border border-white/10 rounded-xl p-4 text-sm text-white"
            placeholder="Write announcement..."></textarea>

          <button data-action="postAnnouncement"
            class="mt-4 px-6 py-3 rounded-xl bg-[#39FF14] text-black font-black uppercase text-[10px]">
            Publish
          </button>
        </div>
      ` : ""}

      <div class="space-y-3">
        ${
          state.announcements.length
            ? state.announcements.map(a => {
                const dt = getTime(a);
                const who = a.createdByName || "Organizer";
                const msg = getText(a);

                return `
                  <div class="rounded-xl border border-white/10 bg-white/5 p-4">
                    <div class="text-[10px] text-slate-400 font-black uppercase tracking-widest">
                      ${dt ? dt.toLocaleString() : "Posting..."}
                      • ${esc(who)}
                    </div>
                    <div class="mt-2 text-white font-bold">
                      ${esc(msg)}
                    </div>
                  </div>
                `;
              }).join("")
            : `
              <div class="text-center text-slate-600 text-[10px] uppercase">
                No announcements yet
              </div>
            `
        }
      </div>

    </div>
  `;
}

function renderPaymentQR(t) {
  const qrBox = document.getElementById("upiQrBox");
  const upiBtn = document.getElementById("upiDeepLink");

  if (!qrBox || !upiBtn || !t?.upi || !t?.entryFee) return;

  // Clear box
  qrBox.innerHTML = "";

  const upiUrl =
    `upi://pay?pa=${encodeURIComponent(t.upi)}` +
    `&pn=${encodeURIComponent(t.organizerName || "Organizer")}` +
    `&am=${encodeURIComponent(t.entryFee)}` +
    `&cu=INR`;

  // 🔹 QR CODE
  if (window.QRCode) {
    new QRCode(qrBox, {
      text: upiUrl,
      width: 180,
      height: 180,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  } else {
    qrBox.innerHTML = `<span class="text-black text-xs font-bold">QR failed</span>`;
  }

  // 🔹 UPI DEEP LINK (opens app)
  upiBtn.href = upiUrl;
}

const navBtn = document.getElementById("hamburgerBtn");
const navMenu = document.getElementById("navMenuItems");
const navOverlay = document.getElementById("navOverlay");

function openNav() {
  const menu = document.getElementById("navMenu");
  const overlay = document.getElementById("navOverlay");

  if (!menu || !overlay) return;

  buildNavMenu(); // 🔥 IMPORTANT

  menu.classList.add("open");
  overlay.classList.add("show");

  menu.style.opacity = "1";
  menu.style.pointerEvents = "auto";

  overlay.style.opacity = "1";
  overlay.style.pointerEvents = "auto";

  document.body.classList.add("nav-open");
}

function closeNav() {
  const menu = document.getElementById("navMenu");
  const overlay = document.getElementById("navOverlay");

  if (!menu || !overlay) return;

  menu.classList.remove("open");

  menu.style.opacity = "0";
  menu.style.pointerEvents = "none";

  overlay.style.opacity = "0";
  overlay.style.pointerEvents = "none";

  document.body.classList.remove("nav-open");
}



navBtn?.addEventListener("click", openNav);
navOverlay?.addEventListener("click", closeNav);

function buildNavMenu() {
  const t = activeTournament();

  let items = [];

  /* =========================
     GLOBAL (no tournament)
  ========================= */
  if (!t) {
    items = [
      { label: "Browse Tournaments", action: "setGlobalTab", value: "Browse Tournaments" },
      { label: "My Tournaments", action: "setGlobalTab", value: "My Tournaments" },
      { label: "Profile", action: "gotoProfile" },
      { divider: true },
      { label: "Logout", action: "logout" }
    ];
  }

  /* =========================
     ADMIN PANEL MENU (🔥 FIX-1)
  ========================= */
  else if (state.inAdminPanel && admin) {
    items = [
      { label: "Participants", action: "setAdminTab", value: "Participants" },
      { label: "Fixtures", action: "setAdminTab", value: "Fixtures" },
      { label: "Announcements", action: "setAdminTab", value: "Announcements" },
      { label: "Disputes", action: "setAdminTab", value: "Disputes" },
      { label: "Permissions", action: "setAdminTab", value: "Permissions" },
      { divider: true },
      { label: "Exit Admin Panel", action: "exitAdminPanel" }
    ];
  }

  /* =========================
     TOURNAMENT MENU (players)
  ========================= */
  else {
    items = [
      { label: "Home", action: "setTournamentTab", value: "Home" },
      { label: "Fixtures", action: "setTournamentTab", value: "Fixtures" },
      { label: "Standings", action: "setTournamentTab", value: "Standings" },
      { label: "Support", action: "setTournamentTab", value: "Support" }
    ];

    if (admin) {
      items.push(
        { divider: true },
        { label: "Admin Panel", action: "enterAdminPanel" }
      );
    }

    items.push(
      { divider: true },
      { label: "Exit Tournament", action: "exitTournament" }
    );
  }

  const navMenuItems = document.getElementById("navMenuItems");
  if (!navMenuItems) return;

  navMenuItems.innerHTML = items.map(i => {
    if (i.divider) {
      return `<div class="my-2 border-t border-white/10"></div>`;
    }

    return `
      <button
        class="nav-item"
        data-action="${i.action}"
        ${i.value ? `data-value="${i.value}"` : ""}>
        ${i.label}
      </button>
    `;
  }).join("");

  bindActions();
}

            </button>

            <button data-action="setAdminTab" data-value="Fixtures" class="menu-item">
              Fixtures
            </button>

            <button data-action="setAdminTab" data-value="Announcements" class="menu-item">
              Announcements
            </button>

            <button data-action="setAdminTab" data-value="Disputes" class="menu-item">
              Disputes
            </button>

            <button data-action="setAdminTab" data-value="Permissions" class="menu-item">
              Permissions
            </button>

            <div class="border-t border-white/10"></div>

            <button data-action="exitAdminPanel"
                    class="menu-item text-[#39FF14]">
              ← Back to Tournament
            </button>

            <div class="border-t border-white/10"></div>

            <button data-action="exitTournament" class="menu-item">
              Exit Tournament
            </button>

            <button data-action="logout" class="menu-item text-red-400">
              Logout
            </button>
          `
          /* =========================================
             INSIDE TOURNAMENT (NORMAL / ADMIN)
          ========================================= */
          : activeTournament()
          ? `
            <button data-action="setTournamentTab" data-value="Home" class="menu-item">
              Home
            </button>

            <button data-action="setTournamentTab" data-value="Fixtures" class="menu-item">
              Fixtures
            </button>

            <button data-action="setTournamentTab" data-value="Standings" class="menu-item">
              Standings
            </button>

            <button data-action="setTournamentTab" data-value="Support" class="menu-item">
              Support
            </button>

            ${
              isAdmin(activeTournament())
                ? `
                  <div class="border-t border-white/10"></div>
                  <button data-action="enterAdminPanel"
                          class="menu-item text-[#39FF14]">
                    Admin Panel
                  </button>
                `
                : ""
            }

            <div class="border-t border-white/10"></div>

            <button data-action="exitTournament" class="menu-item">
              Exit Tournament
            </button>

            <button data-action="logout" class="menu-item text-red-400">
              Logout
            </button>
          `
          /* =========================================
             GLOBAL LOGGED-IN MENU (NO TOURNAMENT)
          ========================================= */
          : `
            <button data-action="setGlobalTab"
                    data-value="Browse Tournaments"
                    class="menu-item">
              Browse Tournaments
            </button>

            <button data-action="setGlobalTab"
                    data-value="My Tournaments"
                    class="menu-item">
              My Tournaments
            </button>

            <button data-action="setGlobalTab"
                    data-value="Profile"
                    class="menu-item">
              Profile
            </button>

            <div class="border-t border-white/10"></div>

            <button data-action="logout" class="menu-item text-red-400">
              Logout
            </button>
          `
        }
      </div>
    </div>
  ` : ""}
`;



  /* ======================================================
     4️⃣ TOURNAMENT VIEW
  ====================================================== */
  const t = activeTournament();
  if (t) {
    let inner = "";
    switch (state.tournamentTab) {
      case "Home": inner = TabHome(t); break;
      case "Players": inner = TabPlayers(t); break;
      case "Standings": inner = TabStandings(t); break;
      case "Fixtures": inner = TabFixtures(t); break;
      case "Bracket": inner = TabBracket(t); break;
      case "Announcements": inner = TabAnnouncements(t); break;
      case "Support": inner = TabSupport(t); break;
      case "Admin": inner = TabAdmin(t); break;
      default: inner = TabHome(t);
    }

    $app.innerHTML = `
      ${Header()}
      ${Menu()}
      ${TournamentLayout(t, inner)}
${state.uiEditRules ? EditRulesModal(t) : ""}

      ${state.showPaymentModal ? PaymentModal(t) : ""}
      ${state.uiMatchModal
        ? MatchCenterModal(state.matches.find(x => x.id === state.uiMatchModal))
        : ""}
      ${state.showCreateTournament ? CreateTournamentModal() : ""}
      ${ToastUI()}
    `;
    bindActions();
    return;
  }

  /* ======================================================
     5️⃣ GLOBAL LOGGED-IN VIEW (NO TOURNAMENT)
  ====================================================== */
  let content = "";
  if (state.globalTab === "Browse Tournaments") content = PageBrowseTournaments();
  else if (state.globalTab === "My Tournaments") content = PageMyTournaments();
  else if (state.globalTab === "Profile") content = PageProfile();
  else if (state.globalTab === "Admin Panel") content = PageAdminPanel();
  else content = PageBrowseTournaments();

  $app.innerHTML = `
    ${Header()}
    ${Menu()}
    ${GlobalLayout(content)}
    ${state.showCreateTournament ? CreateTournamentModal() : ""}
    ${ToastUI()}
  `;
  bindActions();
}


    /* =========================
       11) ACTION BINDINGS
    ========================= */
  function bindActions() {
  document.querySelectorAll("[data-action]").forEach(el => {
// Mobile: close nav after any click
if (window.innerWidth <= 768) {
  closeNav();
}

    el.onclick = async (e) => {

      const action = el.getAttribute("data-action");
      const value = el.getAttribute("data-value");
  // ✅ AUTO-CLOSE HAMBURGER MENU FOR MENU ACTIONS
  const menuActions = [
    "setTournamentTab",
    "setAdminTab",
    "enterAdminPanel",
    "exitAdminPanel",
    "exitTournament",
    "logout"
  ];

  if (menuActions.includes(action)) {
    state.uiMenuOpen = false;
  }


      try {
        // =========================
        // AUTH
        // =========================
        if (action === "openAuth") { state.authModalOpen = true; render(); }
        if (action === "closeAuth") {
  state.authModalOpen = false;
  state.forgotPasswordSent = false;
  render();
}


        if (action === "doLogin") {
          const email = document.getElementById("loginEmail")?.value || "";
          const pass = document.getElementById("loginPass")?.value || "";
          await authLogin(email.trim(), pass);
        }

        if (action === "doSignup") {
          const name = document.getElementById("signupName")?.value || "";
          const email = document.getElementById("signupEmail")?.value || "";
          const pass = document.getElementById("signupPass")?.value || "";
          await authSignup(name.trim(), email.trim(), pass);
        }

        if (action === "logout") {
  state.uiMenuOpen = false;   // ✅ CLOSE MENU
  await doLogout();
}

        // =========================
        // GLOBAL NAV
        // =========================
        if (action === "setGlobalTab") {
  state.uiMenuOpen = false;   // ✅ CLOSE MENU
  state.globalTab = value;
  render();
}
        if (action === "enterTournament") { enterTournament(value); }
        if (action === "exitTournament") {
  state.uiMenuOpen = false;   // ✅ CLOSE MENU
  exitTournament();
}

        // =========================
        // TOURNAMENT TABS (KEEP AS-IS)
        // =========================
        if (action === "setTournamentTab") {
          state.uiMenuOpen = false;   // ✅ CLOSE MENU
  state.tournamentTab = value;

if (value === "Admin" && (!t || !isAdmin(t))) {
    toast("Access denied");
    state.uiMenuOpen = false;
    return;
  }
          if (value === "Support") {
            const t = activeTournament();
            if (!t) return;

            state.uiSupportReady = true;

            // Admin: load thread list
            subscribeSupportContext(t.id);

            // Player: auto-load own chat
            if (!isAdmin(t)) {
              subscribeSupportChat(t.id);
            }
          }

          render();
        }

        // =========================
        // SUPPORT (PLAYER)
        // =========================
        if (action === "sendSupport") {
          const t = activeTournament();
          if (!t) return;

          const input = document.getElementById("supportInput");
          const msg = input?.value?.trim();
          if (!msg) return;

          await sendSupportMessage(t.id, msg);
          input.value = "";
        }

        // =========================
        // PROFILE
        // =========================
        if (action === "openProfileEdit") { state.showProfileEdit = true; render(); }
        if (action === "closeProfileEdit") { state.showProfileEdit = false; render(); }

        if (action === "saveProfile") {
          const form = {
            playerName: document.getElementById("form_playerName")?.value?.trim() || "",
            gameName: document.getElementById("form_gameName")?.value?.trim() || "",
            mobile: document.getElementById("form_mobile")?.value?.trim() || "",
            gameId: document.getElementById("form_gameId")?.value?.trim() || "",
            upiId: document.getElementById("form_upiId")?.value?.trim() || "",
            platform: document.getElementById("form_platform")?.value || "Mobile",
            region: document.getElementById("form_region")?.value || "South Asia"
          };
          await saveProfile(form);
        }

        if (action === "gotoProfile") {
state.uiMenuOpen = false; 
          state.globalTab = "Profile";
          state.showProfileEdit = true;
          exitTournament();
          render();
        }

        // =========================
        // CREATE TOURNAMENT
        // =========================
        if (action === "openCreateTournament") { state.showCreateTournament = true; render(); }
        if (action === "closeCreateTournament") { state.showCreateTournament = false; render(); }

        if (action === "createTournament") {
          const name = document.getElementById("form_t_name")?.value?.trim() || "";
          const game = document.getElementById("form_t_game")?.value?.trim() || "eFootball";
          const format = document.getElementById("form_t_format")?.value || "League";
          const mode = document.getElementById("form_t_mode")?.value || "Normal";
          const maxPlayers = Number(document.getElementById("form_t_max")?.value || 16);
          const type = document.getElementById("form_t_type")?.value || "Free";
          const entryFee = Number(document.getElementById("form_t_fee")?.value || 0);
          const upi = document.getElementById("form_t_upi")?.value?.trim() || "";
          const rules = document.getElementById("form_t_rules")?.value || "";
          const dlRaw = document.getElementById("form_t_deadline")?.value?.trim() || "";

          let deadline = null;
          if (dlRaw) {
            const ms = Number(dlRaw);
            if (!Number.isNaN(ms) && ms > 1000000000) deadline = ms;
            else {
              const dt = new Date(dlRaw);
              if (!Number.isNaN(dt.getTime())) deadline = dt.getTime();
            }
          }

          const sponsorsRaw = document.getElementById("form_t_sponsors")?.value || "";
          const sponsors = sponsorsRaw.split("\n")
            .map(x => x.trim())
            .filter(Boolean)
            .map(line => {
              const parts = line.split("|").map(p => p.trim()).filter(Boolean);
              if (parts.length === 0) return null;
              if (parts.length === 1) return parts[0];
              return { name: parts[0], link: parts[1] || "", tagline: parts[2] || "" };
            })
            .filter(Boolean);

          if (!name) { toast("Tournament name required"); return; }
          if (!deadline) { toast("Deadline required"); return; }

          await createTournament({
            name, game, format, mode, maxPlayers, deadline,
            type,
            entryFee: type === "Paid" ? entryFee : 0,
            upi: type === "Paid" ? upi : "",
            rules,
            visibility: "Public",
            spectators: true,
            sponsors,
            sponsorConfig: { rotateMs: 4500 }
          });
        }

        // =========================
        // JOIN + PAYMENT
        // =========================
        if (action === "joinTournament") {
  const t = activeTournament();
  if (!t) return;

  const uid = state.user?.uid;
  if (!uid) return;

  // 🚫 Already applied or joined
  const already = state.participants.find(p =>
    p.userId === uid &&
    p.tournamentId === t.id &&
    ["pending", "approved", "joined"].includes(p.status)
  );

  if (already) {
    toast("You have already applied or joined this tournament");
    return;
  }

  await requestJoinTournament(t);
}


        if (action === "closePayment") {
          state.showPaymentModal = false;
          state.paymentUTR = "";
          state.paymentExpiresAt = null;
          render();
        }

        if (action === "confirmPaymentJoin") {
          const t = activeTournament();

          if (!state.paymentExpiresAt || Date.now() > state.paymentExpiresAt) {
            toast("Payment session expired. Please reopen payment.");
            state.showPaymentModal = false;
            render();
            return;
          }

          const utr = document.getElementById("utrInput")?.value?.trim() || "";
          if (!utr) { toast("UTR required"); return; }

          await finalizeJoin(t, utr);
        }

        // =========================
        // ADMIN
        // =========================
        if (action === "setAdminTab") { state.uiAdminTab = value; render(); }

        if (action === "approveParticipant") {
          const t = activeTournament();
          await approveParticipant(value, t.id);
        }

        if (action === "generateFixtures") {
          const t = activeTournament();
          await generateLeagueFixtures(t);
        }

        // =========================
        // ANNOUNCEMENTS (FIXED: removed broken duplicate addDoc)
        // =========================
        if (action === "postAnnouncement") {
          const text = document.getElementById("announcementText")?.value?.trim();
          if (!text) { toast("Empty announcement"); return; }

          const t = activeTournament();
          await postAnnouncement(t.id, text, "manual");

          const ta = document.getElementById("announcementText");
          if (ta) ta.value = "";

          toast("Announcement published");
        }

        if (action === "postAnnouncementAdmin") {
          const t = activeTournament();
          const content = document.getElementById("annDraftAdmin")?.value || "";
          await postAnnouncement(t.id, content, "manual");
          if (document.getElementById("annDraftAdmin")) document.getElementById("annDraftAdmin").value = "";
        }

        if (action === "addAdminUid") {
          const t = activeTournament();
          const uid = document.getElementById("newAdminUid")?.value?.trim() || "";
          if (!uid) { toast("UID required"); return; }
          await setAdminUid(t.id, uid, true);
          document.getElementById("newAdminUid").value = "";
        }

        if (action === "removeAdminUid") {
          const t = activeTournament();
          await setAdminUid(t.id, value, false);
        }

        // =========================
        // DISPUTE (keep BOTH behaviors)
        // =========================
        if (action === "resolveDispute") {
          // If clicked from admin tools (value = matchId)
          if (value) {
            await adminResolveDispute(value, "a");
          } else {
            // If clicked from dataset button (uses el.dataset)
            const match = state.matches.find(m => m.id === el.dataset.mid);
            const guilty = el.dataset.guilty;

            const score = prompt("Enter final score (e.g. 2-1)");
            if (match && score) {
              resolveDispute(match, score, guilty);
            }
          }
        }

if (action === "enterAdminPanel") {
  state.inAdminPanel = true;
  state.tournamentTab = "Admin";
  closeNav();
  render();
}

if (action === "exitAdminPanel") {
  state.inAdminPanel = false;
  state.tournamentTab = "Home";
  closeNav();
  render();
}

        // =========================
        // MATCH MODAL + CHAT
        // =========================
        if (action === "openMatch") {
          state.uiMatchModal = value;
          subscribeMatchChat(value);
          render();
        }

        if (action === "sendMatchChat") {
          const text = document.getElementById("matchChatInput")?.value || "";
          if (!text.trim()) return;

          await sendMatchChat(value, text);
          document.getElementById("matchChatInput").value = "";
        }

        if (action === "closeMatch") {
          state.uiMatchModal = null;
          render();
        }

        // =========================
        // SCORE FLOW
        // =========================
        if (action === "toggleReady") {
          const m = state.matches.find(x => x.id === value);
          await toggleReady(m);
        }

        if (action === "submitScore") {
          const m = state.matches.find(x => x.id === value);
          const a = Number(document.getElementById("scoreA")?.value || 0);
          const b = Number(document.getElementById("scoreB")?.value || 0);
          await submitScore(m, a, b);
        }

        if (action === "confirmScore") {
          const m = state.matches.find(x => x.id === value);
          await confirmScore(m);
        }

        if (action === "disputeScore") {
          const m = state.matches.find(x => x.id === value);
          await disputeScore(m);
        }

        // =========================
        // SUPPORT (ADMIN THREAD VIEW)
        // =========================
        if (action === "openTicket") {
          state.uiSupportActiveId = value;
          subscribeSupportMessages(value);
          render();
        }

        if (action === "openSupportThread") {
          const t = activeTournament();
          if (!t) return;
          subscribeAdminThread(t.id, value);
        }

        if (action === "backSupportThreads") {
          const t = activeTournament();
          if (!t) return;
          state.uiSupportActiveId = null;
          state.uiSupportMessages = [];
          state.uiSupportAdminView = "threads";
          subscribeSupportContext(t.id);
          render();
        }

        // =========================
        // COPY/OPEN UPI (MOVED INSIDE TRY so await errors are caught)
        // =========================
        if (action === "copyUpi") {
          const t = activeTournament();
          if (!t?.upi) return toast("UPI not available");

          navigator.clipboard.writeText(t.upi)
            .then(() => toast("UPI ID copied"))
            .catch(() => toast("Copy failed"));
        }

        if (action === "openUPI") {
          const t = activeTournament();
          if (!t?.upi || !t?.entryFee) {
            toast("UPI not configured");
            return;
          }

          const upiUrl =
            `upi://pay?pa=${encodeURIComponent(t.upi)}` +
            `&pn=${encodeURIComponent(t.organizerName || "Organizer")}` +
            `&am=${encodeURIComponent(t.entryFee)}` +
            `&cu=INR&tn=Tournament Entry`;

          window.location.href = upiUrl;
        }

if (action === "openMenu") {
  state.uiMenuOpen = true;
  render();
}

if (action === "closeMenu") {
  state.uiMenuOpen = false;
  render();
}

if (action === "editRules") {
  state.uiEditRules = true;
  render();
}

if (action === "closeEditRules") {
  state.uiEditRules = false;
  render();
}

if (action === "saveRules") {
  const t = activeTournament();
  const rules = document.getElementById("rulesEditor")?.value || "";

  await updateDoc(doc(db, "tournaments", t.id), {
    rules: rules.trim()
  });

  state.uiEditRules = false;
  toast("Rules updated");
}

        // =========================
        // REJECT PARTICIPANT (FIXED: moved inside try)
        // =========================
        if (action === "rejectParticipant") {
          await updateDoc(doc(db, "participants", value), {
            status: "rejected",
            paymentStatus: "REJECTED",
            rejectedAt: now()
          });
          toast("Payment rejected");
        }
if (action === "forgotPassword") {
  const email = document.getElementById("loginEmail")?.value?.trim();

  if (!email) {
    toast("Enter your email to reset password");
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);

    state.forgotPasswordSent = true;

    toast("Password reset link sent to your email");
    render();

  } catch (err) {
    console.error(err);

    toast(
      typeof err?.message === "string"
        ? err.message
        : "Failed to send reset email"
    );
  }
}



if (action === "openMobileNav") openMobileNav();
if (action === "closeMobileNav") closeMobileNav();


        // =========================
        // PRINT
        // =========================
        if (action === "print") window.print();

      } catch (err) {
        console.error(err);
        toast(err?.message || "Action failed");
      }
    };
  });
}


document.addEventListener("click", (e) => {
  if (e.target?.id === "mobileNavBtn") {
    openMobileNav();
  }
});



    // Initial render
    render();


    // Safety: if activeTournament changes while logged in, resubscribe
    // (handled inside enterTournament / exitTournament)

  </script>

  HAMBURGER MENU (FIXED)
========================= -->

<div id="navOverlay"
  class="fixed inset-0 z-[160] bg-black/60 opacity-0 pointer-events-none transition-opacity">
</div>

<div id="navMenu"
  class="fixed top-14 right-4 z-[170]
         w-56 rounded-2xl bg-[#0b0b0b]
         border border-white/10 shadow-2xl
         opacity-0 pointer-events-none
         transition-all duration-200">

  <div id="navMenuItems" class="divide-y divide-white/5"></div>
</div>

</body>
</html>
