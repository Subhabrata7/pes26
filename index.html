function isMatchdayLocked(matchdayNumber) {

function subscribeMyTournaments() {
 if (subs.myOwned) { subs.myOwned(); subs.myOwned = null; }

      id: d.id,

    collection(db, "participants"),
    where("userId", "==", uid)
  );

  subs.myJoined = onSnapshot(joinedQ, snap => {
    state.myJoinedTournamentIds = snap.docs.map(d => d.data().tournamentId);
    mergeMyTournaments();
  });
}

async function mergeMyTournaments() {
  const ids = new Set([
    ...state.myOwnedTournaments.map(t => t.id),
    ...state.myJoinedTournamentIds
  ]);

  if (ids.size === 0) {
    state.myTournaments = [];
    render();
    return;
  }

  // Fetch tournaments for joined IDs not already owned
  const missingIds = [...ids].filter(
    id => !state.myOwnedTournaments.find(t => t.id === id)
  );

  let joinedTournaments = [];

  if (missingIds.length > 0) {
    const chunks = [];
    while (missingIds.length) chunks.push(missingIds.splice(0, 10));

    for (const chunk of chunks) {
      const qy = query(
  collection(db, "tournaments"),
  where(documentId(), "in", chunk)
);


      const snap = await getDocs(qy);
      joinedTournaments.push(
        ...snap.docs.map(d => ({ id: d.id, ...d.data() }))
      );
    }
  }

  state.myTournaments = [
    ...state.myOwnedTournaments,
    ...joinedTournaments
  ];

  render();
}

  async function finalizeJoin(t, utr) {
  if (!state.user || !t) return;

  // 🔒 Prevent expired payment
  if (Date.now() > state.paymentExpiresAt) {
    toast("Payment expired. Please retry.");
    return;
  }

  // 🔐 STRICT UTR VALIDATION (12–22 digits only)
  if (!/^\d{12,22}$/.test(utr)) {
    toast("Invalid UTR format");
    return;
  }

  state.loadingAction = true;
  render();

  try {
    // prevent double join
    if (isRegistered(t)) {
      toast("Already registered");
      return;
    }

    const p = state.profile || {};

    await addDoc(collection(db, "participants"), {
      tournamentId: t.id,
      userId: state.user.uid,
      playerName: p.playerName || state.user.displayName || "Player",
      gameName: p.gameName || "",

}

    function roundRobinCircle(players) {
      // players = [{userId, playerName}]
      const ps = [...players];
      if (ps.length < 2) return [];
      if (ps.length % 2 !== 0) ps.push({ userId:"bye", playerName:"BYE" });
      const rounds = ps.length - 1;
      const half = ps.length / 2;
      const schedule = [];
      let order = 0;

      for (let r = 0; r < rounds; r++) {
        for (let i = 0; i < half; i++) {
          const A = ps[i];
          const B = ps[ps.length - 1 - i];
          if (A.userId !== "bye" && B.userId !== "bye") {
            schedule.push({
              order: order++,
              roundName: `Matchday ${r+1}`,
              playerAId: A.userId, playerAName: A.playerName,
              playerBId: B.userId, playerBName: B.playerName
            });
          }
        }
        // rotate (keep first fixed)
        ps.splice(1, 0, ps.pop());
      }
      return schedule;
    }

    async function generateLeagueFixtures(t) {
      if (!t) return;
      const confirmed = state.participants.filter(p => p.status === "approved");
      if (confirmed.length < 2) { toast("Need 2+ approved players"); return; }

      state.loadingAction = true; render();
      try {
        // prevent regen if matches exist
        if (state.matches.length > 0) {
          toast("Matches already exist");
          return;
        }

        const schedule = roundRobinCircle(confirmed.map(p => ({ userId: p.userId, playerName: p.playerName })));
        for (const m of schedule) {
          await addDoc(collection(db, "matches"), {
            tournamentId: t.id,
            order: m.order,
            roundName: m.roundName,
            status: "pending",
            playerAId: m.playerAId,
            playerAName: m.playerAName,
            playerBId: m.playerBId,
            playerBName: m.playerBName,
            score: { a: 0, b: 0 },
            readyA: false,
            readyB: false
          });
        }
        await updateDoc(doc(db, "tournaments", t.id), { status: "Live" });
        toast("Fixtures generated");
      } catch (e) {
        toast(e?.message || "Generator failed");
      } finally {
        state.loadingAction = false; render();
      }
    }

    // Match Center modal
    async function toggleReady(match) {
if (isMatchdayLocked(match.matchday)) {
  toast("Matchday locked");
  return;
}

      if (!match || !state.user) return;
      const isA = match.playerAId === state.user.uid;
      const isB = match.playerBId === state.user.uid;
      if (!isA && !isB) return;

      const field = isA ? "readyA" : "readyB";
      const val = isA ? !match.readyA : !match.readyB;

      state.loadingAction = true; render();
      try {
        await updateDoc(doc(db, "matches", match.id), { [field]: val });
      } catch (e) {
        toast(e?.message || "Ready toggle failed");
      } finally {
        state.loadingAction = false; render();
      }
    }

    async function submitScore(match, a, b) {
if (isMatchdayLocked(match.matchday)) {
  toast("Matchday locked");
  return;
}

  if (!match || !state.user) return;

  const uid = state.user.uid;
  const isA = match.playerAId === uid;
  const isB = match.playerBId === uid;
  if (!isA && !isB) return;

  // must be in the tournament participants list
  const myP = state.participants.find(p => p.userId === uid);
  if (!myP) { toast("Participant not found"); return; }

  // must be pending + both ready (same as modal gating)
  if ((match.status || "pending") !== "pending") { toast("Match not open"); return; }
  if (!match.readyA || !match.readyB) { toast("Both players must be ready"); return; }

  state.loadingAction = true; render();
  try {
    await updateDoc(doc(db, "participants", myP.id), { accuracyTotal: increment(1) });

    await updateDoc(doc(db, "matches", match.id), {
      "score.a": Number(a),
      "score.b": Number(b),
      status: "pending_confirmation",
      submittedBy: uid,
      submittedAt: now()
    });

    toast("Score submitted");
  } catch (e) {
    console.error(e);
    toast(e?.message || "Submit failed");
  } finally {
    state.loadingAction = false; render();
  }
}


    async function confirmScore(match) {
      if (!match || !state.user) return;
      const isA = match.playerAId === state.user.uid;
      const isB = match.playerBId === state.user.uid;
      if (!isA && !isB) return;
      if (match.submittedBy === state.user.uid) return;

      state.loadingAction = true; render();
      try {
        // reward submitter accuracyConfirmed
        const submitter = state.participants.find(p => p.userId === match.submittedBy);
        if (submitter) {
          await updateDoc(doc(db, "participants", submitter.id), { accuracyConfirmed: increment(1) });
        }
        await updateDoc(doc(db, "matches", match.id), { status: "confirmed", confirmedAt: now() });
        toast("Confirmed");
        state.uiMatchModal = null;
      } catch (e) {
        toast(e?.message || "Confirm failed");
      } finally {
        state.loadingAction = false; render();
      }
    }

    async function disputeScore(match) {
      if (!match || !state.user) return;
      const isA = match.playerAId === state.user.uid;
      const isB = match.playerBId === state.user.uid;
      if (!isA && !isB) return;

      const myP = state.participants.find(p => p.userId === state.user.uid);
      if (!myP) return;

      state.loadingAction = true; render();
      try {
        await updateDoc(doc(db, "participants", myP.id), { disputeStrikes: increment(1) });
        await updateDoc(doc(db, "matches", match.id), { status: "disputed", disputerId: state.user.uid, disputedAt: now() });

        // simple policy: if strikes >=3 -> mark participant flagged (UI)
        toast("Disputed (strike added)");
        state.uiMatchModal = null;
      } catch (e) {
        toast(e?.message || "Dispute failed");
      } finally {
        state.loadingAction = false; render();
      }
    }

async function sendSupportMessage(tid, text) {
  if (!tid || !text.trim() || !state.user) return;

  const t = activeTournament();
  const uid = state.user.uid;

  // ✅ target thread:
  // - player writes to their own thread
  // - admin writes to currently opened player thread
  const targetPlayerUid = isAdmin(t) ? state.uiSupportActiveId : uid;
  if (!targetPlayerUid) {

  // ensure thread doc exists
  await ensureSupportThread(tid, targetPlayerUid);

  const threadRef = doc(db, "tournaments", tid, "support_threads", targetPlayerUid);

  await addDoc(collection(threadRef, "messages"), {

    fromRole: isAdmin(t) ? "admin" : "player",

  await updateDoc(threadRef, {

    lastUpdated: serverTimestamp()
  });

async function resolveDispute(match, finalScore, guiltyPlayerId) {

  try {
    // 1️⃣ Update match
    await updateDoc(doc(db, "matches", match.id), {
      score: finalScore,
      status: "confirmed",
      resolvedBy: state.user.uid,
      resolvedAt: serverTimestamp()

    // 2️⃣ Add strike to participant
    const q = query(
      collection(db, "participants"),
      where("tournamentId", "==", match.tournamentId),
      where("userId", "==", guiltyPlayerId)
    );

    const snap = await getDocs(q);
    snap.forEach(async d => {
      await updateDoc(d.ref, {
        disputeStrikes: increment(1)
      });
    });

    toast("Dispute resolved & strike applied");
  } catch (e) {
    toast(e.message || "Resolve failed");
  }
}


async function checkAndStartMatchdays(tournamentId) {
  if (!state.user) return;

  const now = new Date();

  const q = query(
    collection(db, "matchdays"),
    where("tournamentId", "==", tournamentId),
    where("started", "==", false)
  );

  const snap = await getDocs(q);
  if (snap.empty) return;

  for (const docSnap of snap.docs) {
    const md = docSnap.data();
    const mdDate = md.date.toDate();

    // Matchday date has arrived
    if (mdDate <= now) {

      // 🔒 Run-once protection
      if (md.started === true) continue;

      // 1️⃣ Mark matchday started
      await updateDoc(doc(db, "matchdays", docSnap.id), {
        started: true,
        startedAt: serverTimestamp()
      });

      // 2️⃣ Create announcement
      await addDoc(
        collection(db, "tournaments", tournamentId, "announcements"),
        {
          type: "matchday_start",
          title: `Matchday ${md.number} Started`,
          message: `Matchday ${md.number} has started. Congratulations to all players!`,
          matchday: md.number,
          createdAt: serverTimestamp(),
          system: true
        }
      );

      console.log(`Matchday ${md.number} started automatically`);
    }
  }
}


async function checkAndEndMatchdays(tournamentId) {
  if (!state.user) return;

  const now = new Date();

  const mdSnap = await getDocs(
    query(
      collection(db, "matchdays"),
      where("tournamentId", "==", tournamentId),
      where("started", "==", true),
      where("locked", "==", false)
    )
  );

  for (const mdDoc of mdSnap.docs) {
    const md = mdDoc.data();
    const mdDate = md.date.toDate();

    // Matchday ended
    if (mdDate < now) {

      // Get all matches of this matchday
      const matchSnap = await getDocs(
        query(
          collection(db, "matches"),
          where("tournamentId", "==", tournamentId),
          where("matchday", "==", md.number)
        )
      );

      for (const mDoc of matchSnap.docs) {
        const m = mDoc.data();

        if (m.status === "confirmed") continue;

        let scoreA = 0, scoreB = 0;

        // 🟢 One ready → 3–0
        if (m.readyA && !m.readyB) {
          scoreA = 3;
        } else if (!m.readyA && m.readyB) {
          scoreB = 3;
        }
        // 🟡 Both ready or none → 0–0

        await updateDoc(doc(db, "matches", mDoc.id), {
          "score.a": scoreA,
          "score.b": scoreB,
          status: "confirmed",
          autoResolved: true,
          resolvedAt: serverTimestamp()
        });
      }

      // 🔒 Lock matchday
      await updateDoc(doc(db, "matchdays", mdDoc.id), {
        locked: true,
        lockedAt: serverTimestamp()
      });

      console.log(`Matchday ${md.number} auto-closed`);
    }
  }
}



    /* =========================
       7) STANDINGS (computed)
    ========================= */
    function computeStandings() {
      const ps = state.participants.filter(p => p.status === "approved" || p.status === "pending" || p.status === "banned");
      const rows = ps.map(p => ({
        userId: p.userId,
        name: p.playerName || "Player",
        p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0
      }));

      const confirmed = state.matches.filter(m => m.status === "confirmed");
      for (const m of confirmed) {
        const A = rows.find(r => r.userId === m.playerAId);
        const B = rows.find(r => r.userId === m.playerBId);
        if (!A || !B) continue;
        const sa = Number(m.score?.a ?? 0);
        const sb = Number(m.score?.b ?? 0);

        A.p++; B.p++;
        A.gf += sa; A.ga += sb;
        B.gf += sb; B.ga += sa;

        if (sa > sb) { A.w++; A.pts += 3; B.l++; }
        else if (sb > sa) { B.w++; B.pts += 3; A.l++; }
        else { A.d++; B.d++; A.pts += 1; B.pts += 1; }
      }
      for (const r of rows) r.gd = r.gf - r.ga;

      // sort PTS > GD > GF
      rows.sort((a,b) => (b.pts-a.pts) || (b.gd-a.gd) || (b.gf-a.gf) || (a.name.localeCompare(b.name)));
      return rows;
    }

    function SponsorBannerUI(t) {
      const sponsors = Array.isArray(t?.sponsors) ? t.sponsors : [];
      if (!sponsors.length) return "";
      const s = sponsors[Math.min(state.sponsorIndex, sponsors.length-1)];
      const name = (typeof s === "string") ? s : (s?.name || "Sponsor");
      const link = (typeof s === "object") ? (s?.link || "") : "";
      const tagline = (typeof s === "object") ? (s?.tagline || "") : "";
      const matchday = t?.currentMatchday || "";

      return `
        <div class="rounded-[2rem] border border-white/10 bg-[#0a0a0a] p-6 shadow-2xl relative overflow-hidden">
          <div class="absolute -top-24 -right-24 w-64 h-64 bg-[#39FF14]/10 blur-3xl rounded-full"></div>

              ${tagline ? `<div class="mt-1 text-[11px] font-bold text-slate-400">${esc(tagline)}</div>` : ""}
              ${matchday ? `<div class="mt-2 text-[9px] font-black uppercase tracking-widest text-[#39FF14]">Matchday: ${esc(matchday)}</div>` : ""}
            </div>
            <div class="flex items-center gap-3">
              ${link ? `<a href="${esc(link)}" target="_blank" class="px-6 py-3 rounded-xl bg-[#39FF14] text-black font-black uppercase tracking-widest text-[10px]">Visit</a>` : ""}

      return `

          <div class="px-6 py-4 rounded-2xl bg-black/90 border border-white/10 shadow-2xl text-slate-200 font-black uppercase tracking-widest text-[10px]">
            ${esc(state.toast.msg)}

      return `

            <div class="relative z-10 space-y-6">
              <div class="flex flex-wrap gap-2">
                <span class="px-3 py-1.5 rounded-full text-[9px] font-black uppercase tracking-widest border border-white/10 text-slate-400">${esc(t.format||"League")}</span>
                <span class="px-3 py-1.5 rounded-full text-[9px] font-black uppercase tracking-widest border border-white/10 text-slate-400">${esc(t.mode||"Normal")}</span>
                <span class="px-3 py-1.5 rounded-full text-[9px] font-black uppercase tracking-widest border border-[#39FF14]/30 text-[#39FF14] bg-[#39FF14]/5">${esc(t.status||"")}</span>

${MatchdayLiveBanner()}

      if (t.status !== "Registration Open") {
        return `<div class="rounded-2xl px-8 py-6 text-center font-black uppercase tracking-[0.35em] text-[10px] bg-white/5 border border-white/10 text-slate-500">Registration closed</div>`;

        return `<div class="rounded-2xl px-8 py-6 text-center font-black uppercase tracking-[0.35em] text-[10px] bg-white/5 border border-white/10 text-slate-500">Tournament full</div>`;

        return `

      return `

    <span class="px-2 py-1 rounded-full text-[8px]
      font-black uppercase tracking-widest
      bg-[#39FF14]/20 text-[#39FF14]">
      PAID
    </span>
  ` : ""}
</div>

                      <div class="mt-1 flex items-center gap-2">

    function TabStandings(t) {
      const rows = computeStandings();
      return `
        <div class="space-y-8 print:bg-white print:text-black">
          <div class="flex items-end justify-between border-l-4 border-[#39FF14] pl-6 print-hidden">

            </div>
            <button data-action="print" class="px-6 py-3 rounded-xl border border-white/10 bg-white/5 text-slate-200 font-black uppercase tracking-widest text-[10px] hover:bg-[#39FF14] hover:text-black transition-all">
              ${Icon("download","w-4 h-4 inline-block -mt-0.5 mr-2")}Export PDF
            </button>
          </div>

                <tr class="bg-white/5 text-[10px] font-black uppercase tracking-[0.3em] text-slate-500 border-b border-white/10">

                  <th class="p-6 text-center">P</th>
                  <th class="p-6 text-center">W</th>
                  <th class="p-6 text-center">D</th>
                  <th class="p-6 text-center">L</th>
                  <th class="p-6 text-center">GF</th>
                  <th class="p-6 text-center">GA</th>
                  <th class="p-6 text-center">GD</th>
                  <th class="p-6 text-center text-[#39FF14]">PTS</th>

              <tbody>

                  <tr class="border-b border-white/10 hover:bg-white/[0.03]">
                    <td class="p-6 font-black italic text-2xl text-[#39FF14]">${i+1}</td>
                    <td class="p-6 font-black uppercase italic text-white text-lg">${esc(r.name)}</td>
                    <td class="p-6 text-center font-black text-slate-200">${r.p}</td>
                    <td class="p-6 text-center font-black text-slate-200">${r.w}</td>
                    <td class="p-6 text-center font-black text-slate-200">${r.d}</td>
                    <td class="p-6 text-center font-black text-slate-200">${r.l}</td>
                    <td class="p-6 text-center font-black text-slate-200">${r.gf}</td>
                    <td class="p-6 text-center font-black text-slate-200">${r.ga}</td>
                    <td class="p-6 text-center font-black text-slate-200">${r.gd>0?`+${r.gd}`:r.gd}</td>
                    <td class="p-6 text-center font-black italic text-white text-2xl">${r.pts}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function TabFixtures(t) {
      const uid = state.user.uid;
      const list = state.matches;

      return `
        <div class="space-y-8">
          <div class="border-l-4 border-[#39FF14] pl-6">
            <h2 class="text-3xl font-black italic uppercase tracking-tighter">Fixtures</h2>
            <p class="text-[10px] font-black uppercase tracking-[0.35em] text-slate-500 mt-2">Match schedule</p>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${list.map(m => {
              const mine = (m.playerAId===uid || m.playerBId===uid);
              const readyA = !!m.readyA;
              const readyB = !!m.readyB;
              const status = m.status || "pending";

              return `
                <div class="${cn(
                  "rounded-[2rem] border bg-[#0a0a0a] p-6 shadow-2xl cursor-pointer hover:border-[#39FF14]/30 transition-all relative overflow-hidden",
                  mine ? "border-[#39FF14]/35" : "border-white/10"
                )}" data-action="openMatch" data-value="${esc(m.id)}">
                  <div class="absolute -top-24 -right-24 w-64 h-64 bg-[#39FF14]/10 blur-3xl rounded-full opacity-60"></div>

                  <div class="relative z-10">
                    <div class="flex items-center justify-between">
                      <span class="px-3 py-1.5 rounded-full text-[9px] font-black uppercase tracking-widest border border-white/10 text-slate-400 bg-white/5">${esc(m.roundName || "League Match")}</span>
                      <span class="${cn(
                        "px-3 py-1.5 rounded-full text-[9px] font-black uppercase tracking-widest border",
                        status==="confirmed" ? "border-[#39FF14]/30 text-[#39FF14] bg-[#39FF14]/5" :
                        status==="disputed" ? "border-red-500/30 text-red-400 bg-red-500/5" :
                        status==="pending_confirmation" ? "border-orange-500/30 text-orange-300 bg-orange-500/5" :
                        "border-white/10 text-slate-500 bg-white/5"
                      )}">
                        ${esc(status.replaceAll("_"," "))}
                      </span>
                    </div>

                    <div class="mt-6 grid grid-cols-3 items-center text-center">
                      <div class="space-y-2">
                        <div class="font-black uppercase italic text-white truncate">${esc(m.playerAName||"P1")}</div>
                        <div class="${cn("w-2 h-2 rounded-full mx-auto", readyA ? "bg-[#39FF14] shadow-[0_0_10px_#39FF14]" : "bg-slate-700")}"></div>
                      </div>

                      <div class="text-4xl font-black italic text-white tracking-tighter">
                        ${status==="pending" ? "VS" : `${Number(m.score?.a||0)}:${Number(m.score?.b||0)}`}
                      </div>

                      <div class="space-y-2">
                        <div class="font-black uppercase italic text-white truncate">${esc(m.playerBName||"P2")}</div>
                        <div class="${cn("w-2 h-2 rounded-full mx-auto", readyB ? "bg-[#39FF14] shadow-[0_0_10px_#39FF14]" : "bg-slate-700")}"></div>
                      </div>
                    </div>

                    ${mine ? `<div class="mt-5 text-[9px] font-black uppercase tracking-widest text-[#39FF14]">Your matchup</div>` : ""}
                  </div>
                </div>
              `;
            }).join("")}
          </div>

          ${!list.length ? `<div class="py-20 text-center text-slate-600 font-black uppercase tracking-widest text-[10px]">No fixtures yet</div>` : ""}
        </div>
      `;
    }

    function TabBracket(t) {
      // basic bracket from matches with roundName not "Matchday X" (if knockout exists later)
      const knockout = state.matches.filter(m => m.roundName && !String(m.roundName).startsWith("Matchday"));
      if (!knockout.length) {
        return `
          <div class="rounded-[2.5rem] border border-white/10 bg-[#0a0a0a] p-10 shadow-2xl">
            <div class="border-l-4 border-[#39FF14] pl-6">
              <h2 class="text-3xl font-black italic uppercase tracking-tighter">Bracket</h2>
              <p class="text-[10px] font-black uppercase tracking-[0.35em] text-slate-500 mt-2">Knockout view</p>
            </div>
            <div class="mt-10 text-slate-600 font-black uppercase tracking-widest text-[10px]">
              No knockout rounds available (League tournaments may not have bracket).
            </div>
          </div>
        `;
      }

      const grouped = {};
      for (const m of knockout) {
        grouped[m.roundName] = grouped[m.roundName] || [];
        grouped[m.roundName].push(m);
      }
      const rounds = Object.keys(grouped);

      return `
        <div class="space-y-8">
          <div class="flex items-end justify-between border-l-4 border-[#39FF14] pl-6 print-hidden">
            <div>
              <h2 class="text-3xl font-black italic uppercase tracking-tighter">Bracket</h2>
              <p class="text-[10px] font-black uppercase tracking-[0.35em] text-slate-500 mt-2">Knockout view</p>
            </div>
            <button data-action="print" class="px-6 py-3 rounded-xl border border-white/10 bg-white/5 text-slate-200 font-black uppercase tracking-widest text-[10px] hover:bg-[#39FF14] hover:text-black transition-all">
              ${Icon("download","w-4 h-4 inline-block -mt-0.5 mr-2")}Export PDF
            </button>
          </div>

          <div class="rounded-[2.5rem] border border-white/10 bg-[#0a0a0a] p-6 shadow-2xl overflow-x-auto no-scrollbar print-card">
            <div class="flex gap-10 min-w-max">
              ${rounds.map(rn => `
                <div class="w-[320px] space-y-4">
                  <div class="text-center text-[10px] font-black uppercase tracking-[0.5em] text-[#39FF14]">${esc(rn)}</div>
                  <div class="space-y-4">
                    ${grouped[rn].map(m => `
                      <div class="rounded-2xl border border-white/10 bg-white/5 p-5">
                        <div class="flex items-center justify-between">
                          <div class="${cn("font-black uppercase italic truncate", (m.status==="confirmed" && Number(m.score?.a||0) > Number(m.score?.b||0)) ? "text-[#39FF14]" : "text-white")}">${esc(m.playerAName)}</div>
                          <div class="font-black italic text-lg text-white">${m.status==="confirmed" ? Number(m.score?.a||0) : "-"}</div>
                        </div>
                        <div class="mt-3 pt-3 border-t border-white/10 flex items-center justify-between">
                          <div class="${cn("font-black uppercase italic truncate", (m.status==="confirmed" && Number(m.score?.b||0) > Number(m.score?.a||0)) ? "text-[#39FF14]" : "text-white")}">${esc(m.playerBName)}</div>
                          <div class="font-black italic text-lg text-white">${m.status==="confirmed" ? Number(m.score?.b||0) : "-"}</div>
                        </div>
                      </div>
                    `).join("")}
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function TabAnnouncements(t) {
  const canPost = isAdmin(t);

  return `
    <div class="space-y-6">

      ${canPost ? `
        <div class="rounded-2xl border border-white/10 bg-[#0a0a0a] p-6">
          <textarea id="announcementText"
            class="w-full h-28 bg-black border border-white/10 rounded-xl p-4 text-sm text-white"
            placeholder="Write announcement..."></textarea>

          <button data-action="postAnnouncement"
            class="mt-4 px-6 py-3 rounded-xl bg-[#39FF14] text-black font-black uppercase text-[10px]">
            Publish
          </button>
        </div>
      ` : ""}

      <div class="space-y-3">
        ${
          state.announcements.length
            ? state.announcements.map(a => {
                const ts =
                  a.createdAt?.toDate
                    ? a.createdAt.toDate()
                    : null;

                return `
                  <div class="rounded-xl border border-white/10 bg-white/5 p-4">
                    <div class="text-[10px] text-slate-400 font-black uppercase tracking-widest">
                      ${ts ? ts.toLocaleString() : "Sending..."}
                      • ${esc(a.createdByName || "Organizer")}
                    </div>
                    <div class="mt-2 text-white font-bold">
                      ${esc(a.text)}
                    </div>
                  </div>
                `;
              }).join("")
            : `
              <div class="text-center text-slate-600 text-[10px] uppercase">
                No announcements yet
              </div>
            `
        }
      </div>

    </div>
  `;
}



function TabSupport(t) {

  // Safety: user must be logged in
  if (!state.user) {
    return `<div class="p-10 text-center text-slate-600">Login required</div>`;
  }

  // If support not initialized yet
  if (!state.uiSupportReady) {
    return `<div class="p-10 text-center text-slate-600">Loading support…</div>`;
  }

  const isAdminUser = isAdmin(t);

  return `
    <div class="rounded-[2rem] border border-white/10 bg-black p-6 h-[70vh] flex gap-4">

      <!-- ADMIN: THREAD LIST -->
      ${isAdminUser ? `
        <div class="w-64 shrink-0 border-r border-white/10 pr-3 overflow-y-auto">
          <div class="text-[10px] uppercase font-black text-slate-400 mb-3">
            Support Threads
          </div>

          ${state.supportThreads.length === 0 ? `
            <div class="text-slate-600 text-sm">
              No player messages yet
            </div>
          ` : state.supportThreads.map(th => `
            <button
              data-action="openSupportThread"
              data-value="${th.playerUid}"
              class="block w-full text-left px-3 py-2 rounded-xl mb-2
                ${state.uiSupportActiveId === th.playerUid
                  ? "bg-[#39FF14] text-black"
                  : "bg-white/5 text-white hover:bg-white/10"}">
              <div class="font-semibold text-sm">
                ${esc(th.playerName || th.playerUid)}
              </div>
              ${th.lastMessage ? `
                <div class="text-xs opacity-60 truncate">
                  ${esc(th.lastMessage)}
                </div>
              ` : ``}
            </button>
          `).join("")}
        </div>
      ` : ``}

      <!-- CHAT AREA -->
      <div class="flex flex-col flex-1">

        <!-- MESSAGES -->
        <div class="flex-1 overflow-y-auto space-y-3 pr-1">

          ${state.supportMessages.length === 0 ? `
            <div class="text-center text-slate-600 mt-10">
              No messages yet
            </div>
          ` : state.supportMessages.map(m => `
            <div class="${m.fromUid === state.user.uid ? "text-right" : "text-left"}">
              <div class="inline-block max-w-[75%] px-4 py-2 rounded-xl
                ${m.fromUid === state.user.uid
                  ? "bg-[#39FF14] text-black"
                  : "bg-white/10 text-white"}">
                <div class="text-[9px] font-black uppercase opacity-60">
                  ${esc(m.fromName)} • ${esc(m.fromRole)}
                </div>
                <div class="mt-1 text-sm">${esc(m.text)}</div>
              </div>
            </div>
          `).join("")}

        </div>

        <!-- INPUT BAR -->
        <div class="mt-4 flex gap-2" data-support-bar>
          <input
            id="supportInput"
            data-support-input
            class="flex-1 bg-black border border-white/10 rounded-xl px-4 py-3 text-white"
            placeholder="${isAdminUser && !state.uiSupportActiveId
              ? "Select a player to reply…"
              : "Type message…"}"
            ${isAdminUser && !state.uiSupportActiveId ? "disabled" : ""}
          />
          <button
            data-action="sendSupport"
            class="px-6 py-3 rounded-xl bg-[#39FF14] text-black font-black
              ${isAdminUser && !state.uiSupportActiveId ? "opacity-40 cursor-not-allowed" : ""}">
            Send
          </button>
        </div>

      </div>
    </div>
  `;
}






function SupportChatBox() {

      ${(state.supportMessages || []).map(m => `
        <div class="flex ${m.senderId === state.user.uid ? "justify-end" : "justify-start"}">

        Send
      </button>
    </div>
  `;
}

function renderPaymentQR(t) {
  const qrBox = document.getElementById("upiQrBox");
  const upiBtn = document.getElementById("upiDeepLink");

  if (!qrBox || !upiBtn || !t?.upi || !t?.entryFee) return;

  // Clear box
  qrBox.innerHTML = "";

  const upiUrl =
    `upi://pay?pa=${encodeURIComponent(t.upi)}` +
    `&pn=${encodeURIComponent(t.organizerName || "Organizer")}` +
    `&am=${encodeURIComponent(t.entryFee)}` +
    `&cu=INR`;

  // 🔹 QR CODE
  if (window.QRCode) {
    new QRCode(qrBox, {
      text: upiUrl,
      width: 180,
      height: 180,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  } else {
    qrBox.innerHTML = `<span class="text-black text-xs font-bold">QR failed</span>`;
  }

  // 🔹 UPI DEEP LINK (opens app)
  upiBtn.href = upiUrl;
}


function subscribeSupportChat(tournamentId) {
  if (!state.user || !tournamentId) return;

  state.uiSupportReady = true;

  const t = activeTournament();
  const uid = state.user.uid;

  // player -> own thread
  // admin  -> selected player thread
  const targetPlayerUid = isAdmin(t) ? state.uiSupportActiveId : uid;

  if (!targetPlayerUid) {
    state.supportMessages = [];
    render();
    return;
  }

  const threadRef = doc(db, "tournaments", tournamentId, "support_threads", targetPlayerUid);

  const msgsQ = query(
    collection(threadRef, "messages"),
    orderBy("createdAt", "asc")
  );

  if (subs.support) { subs.support(); subs.support = null; }

  subs.support = onSnapshot(msgsQ, (snap) => {
    state.supportMessages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, () => render());
}

            <div class="w-12 h-12 rounded-full border-2 border-white/10 border-t-[#39FF14] animate-spin"></div>
            <div class="text-[11px] font-black uppercase tracking-[0.5em] text-slate-600">Syncing…</div>
          </div>
        `;
        return;
      }

      // Anonymous → Landing only (NO DATA)
      if (!isLoggedIn()) {
        $app.innerHTML = `
          ${PublicLanding()}
          ${state.authModalOpen ? AuthModal() : ""}
          ${ToastUI()}
        `;
        bindActions();
if (state.showPaymentModal) {
  setTimeout(() => renderPaymentQR(t), 0);
}

        return;
      }

      // Logged in
      const t = activeTournament();

      // Tournament view
      if (t) {
        let inner = "";
        switch (state.tournamentTab) {
          case "Home": inner = TabHome(t); break;
          case "Players": inner = TabPlayers(t); break;
          case "Standings": inner = TabStandings(t); break;
          case "Fixtures": inner = TabFixtures(t); break;
          case "Bracket": inner = TabBracket(t); break;
          case "Announcements": inner = TabAnnouncements(t); break;
          case "Support": inner = TabSupport(t); break;
          case "Admin": inner = TabAdmin(t); break;
          default: inner = TabHome(t);
        }

        $app.innerHTML = `
          ${TournamentLayout(t, inner)}
          ${state.showPaymentModal ? PaymentModal(t) : ""}
          ${state.uiMatchModal ? MatchCenterModal(state.matches.find(x => x.id === state.uiMatchModal) || null) : ""}
          ${state.showCreateTournament ? CreateTournamentModal() : ""}
        `;
        bindActions();
        return;
      }

      // Global view
      let content = "";
      if (state.globalTab === "Browse Tournaments") content = PageBrowseTournaments();
      else if (state.globalTab === "My Tournaments") content = PageMyTournaments();
      else if (state.globalTab === "Profile") content = PageProfile();
      else if (state.globalTab === "Admin Panel") content = PageAdminPanel();
      else content = PageBrowseTournaments();

      $app.innerHTML = `
        ${GlobalLayout(`
          <div class="flex items-center justify-between gap-3 mb-8 print-hidden">
            ${ChipTabs(GLOBAL_TABS, state.globalTab, "setGlobalTab")}
          </div>

          ${content}
        `)}
        ${state.authModalOpen ? AuthModal() : ""}
        ${state.showCreateTournament ? CreateTournamentModal() : ""}
      `;
      bindActions();
    }

    /* =========================
       11) ACTION BINDINGS
    ========================= */
    function bindActions() {
      // generic
      document.querySelectorAll("[data-action]").forEach(el => {
        el.onclick = async (e) => {
          const action = el.getAttribute("data-action");
          const value = el.getAttribute("data-value");



  

          try {
            if (action === "openAuth") { state.authModalOpen = true; render(); }
            if (action === "closeAuth") { state.authModalOpen = false; render(); }

            if (action === "doLogin") {
              const email = document.getElementById("loginEmail")?.value || "";
              const pass = document.getElementById("loginPass")?.value || "";
              await authLogin(email.trim(), pass);
            }

            if (action === "doSignup") {
              const name = document.getElementById("signupName")?.value || "";
              const email = document.getElementById("signupEmail")?.value || "";
              const pass = document.getElementById("signupPass")?.value || "";
              await authSignup(name.trim(), email.trim(), pass);
            }

            if (action === "logout") await doLogout();

            if (action === "setGlobalTab") { state.globalTab = value; render(); }

            if (action === "enterTournament") { enterTournament(value); }

            if (action === "exitTournament") { exitTournament(); }

            if (action === "setTournamentTab") {
  state.tournamentTab = value;

  if (value === "Support") {
    const t = activeTournament();
    if (!t) return;

    state.uiSupportReady = true;

    // Admin: load thread list
    subscribeSupportContext(t.id);

    // Player: auto-load own chat
    if (!isAdmin(t)) {
      subscribeSupportChat(t.id);
    }
  }

  render();
}

  if (action === "sendSupport") {
      const t = activeTournament();
      if (!t) return;

      const input = document.getElementById("supportInput");
      const msg = input?.value?.trim();
      if (!msg) return;

      await sendSupportMessage(t.id, msg);
      input.value = "";
    }

            if (action === "openProfileEdit") { state.showProfileEdit = true; render(); }
            if (action === "closeProfileEdit") { state.showProfileEdit = false; render(); }

            if (action === "saveProfile") {
              const form = {
                playerName: document.getElementById("form_playerName")?.value?.trim() || "",
                gameName: document.getElementById("form_gameName")?.value?.trim() || "",
                mobile: document.getElementById("form_mobile")?.value?.trim() || "",
                gameId: document.getElementById("form_gameId")?.value?.trim() || "",
                upiId: document.getElementById("form_upiId")?.value?.trim() || "",
                platform: document.getElementById("form_platform")?.value || "Mobile",
                region: document.getElementById("form_region")?.value || "South Asia"
              };
              await saveProfile(form);
            }

            if (action === "gotoProfile") {
              state.globalTab = "Profile";
              state.showProfileEdit = true;
              exitTournament();
              render();
            }

            if (action === "openCreateTournament") { state.showCreateTournament = true; render(); }
            if (action === "closeCreateTournament") { state.showCreateTournament = false; render(); }

            if (action === "createTournament") {
              const name = document.getElementById("form_t_name")?.value?.trim() || "";
              const game = document.getElementById("form_t_game")?.value?.trim() || "eFootball";
              const format = document.getElementById("form_t_format")?.value || "League";
              const mode = document.getElementById("form_t_mode")?.value || "Normal";
              const maxPlayers = Number(document.getElementById("form_t_max")?.value || 16);
              const type = document.getElementById("form_t_type")?.value || "Free";
              const entryFee = Number(document.getElementById("form_t_fee")?.value || 0);
              const upi = document.getElementById("form_t_upi")?.value?.trim() || "";
              const rules = document.getElementById("form_t_rules")?.value || "";
              const dlRaw = document.getElementById("form_t_deadline")?.value?.trim() || "";

              let deadline = null;
              // accept ISO or ms
              if (dlRaw) {
                const ms = Number(dlRaw);
                if (!Number.isNaN(ms) && ms > 1000000000) deadline = ms;
                else {
                  const dt = new Date(dlRaw);
                  if (!Number.isNaN(dt.getTime())) deadline = dt.getTime();
                }
              }

              const sponsorsRaw = document.getElementById("form_t_sponsors")?.value || "";
              const sponsors = sponsorsRaw.split("\n").map(x => x.trim()).filter(Boolean).map(line => {
                const parts = line.split("|").map(p => p.trim()).filter(Boolean);
                if (parts.length === 0) return null;
                if (parts.length === 1) return parts[0];
                return { name: parts[0], link: parts[1] || "", tagline: parts[2] || "" };
              }).filter(Boolean);

              if (!name) { toast("Tournament name required"); return; }
              if (!deadline) { toast("Deadline required"); return; }

              await createTournament({
                name, game, format, mode, maxPlayers, deadline,
                type,
                entryFee: type==="Paid" ? entryFee : 0,
                upi: type==="Paid" ? upi : "",
                rules,
                visibility: "Public",
                spectators: true,
                sponsors,
                sponsorConfig: { rotateMs: 4500 }
              });
            }

            if (action === "joinTournament") {
              const t = activeTournament();
              await requestJoinTournament(t);
            }

            if (action === "closePayment") {
  state.showPaymentModal = false;
  state.paymentUTR = "";
  state.paymentExpiresAt = null;
  render();
}


            if (action === "confirmPaymentJoin") {
  const t = activeTournament();

  // ⛔ Payment expired
  if (!state.paymentExpiresAt || Date.now() > state.paymentExpiresAt) {
    toast("Payment session expired. Please reopen payment.");
    state.showPaymentModal = false;
    render();
    return;
  }

  const utr = document.getElementById("utrInput")?.value?.trim() || "";
  if (!utr) { toast("UTR required"); return; }

  await finalizeJoin(t, utr);
}


            if (action === "setAdminTab") { state.uiAdminTab = value; render(); }

            if (action === "approveParticipant") {
              const t = activeTournament();
              await approveParticipant(value, t.id);
            }

            if (action === "generateFixtures") {
              const t = activeTournament();
              await generateLeagueFixtures(t);
            }

            if (action === "postAnnouncement") {
  const text = document.getElementById("announcementText")?.value?.trim();
  if (!text) {
    toast("Empty announcement");
    return;
  }

  const t = activeTournament();

  await addDoc(
    collection(db, "tournaments", t.id, "announcements"),
    {
      text: text,
      createdAt: serverTimestamp(),     // ✅ ALWAYS server time
      createdBy: state.user.uid,
      createdByName:
        state.profile?.playerName ||
        state.user.displayName ||
        "Organizer"
    }
  );

  document.getElementById("announcementText").value = "";
  toast("Announcement published");
}



            if (action === "postAnnouncementAdmin") {
              const t = activeTournament();
              const content = document.getElementById("annDraftAdmin")?.value || "";
              await postAnnouncement(t.id, content, "manual");
              if (document.getElementById("annDraftAdmin")) document.getElementById("annDraftAdmin").value = "";
            }

            if (action === "addAdminUid") {
              const t = activeTournament();
              const uid = document.getElementById("newAdminUid")?.value?.trim() || "";
              if (!uid) { toast("UID required"); return; }
              await setAdminUid(t.id, uid, true);
              document.getElementById("newAdminUid").value = "";
            }

            if (action === "removeAdminUid") {
              const t = activeTournament();
              await setAdminUid(t.id, value, false);
            }

            if (action === "resolveDispute") {
              await adminResolveDispute(value, "a");
            }

            if (action === "openMatch") {
  state.uiMatchModal = value;
  subscribeMatchChat(value);   // ✅ IMPORTANT
  render();
}
if (action === "sendMatchChat") {
  const text = document.getElementById("matchChatInput")?.value || "";
  if (!text.trim()) return;

  await sendMatchChat(value, text);
  document.getElementById("matchChatInput").value = "";
}



            if (action === "closeMatch") {
              state.uiMatchModal = null;
              render();
            }

            if (action === "toggleReady") {
              const m = state.matches.find(x => x.id === value);
              await toggleReady(m);
            }

            if (action === "submitScore") {
              const m = state.matches.find(x => x.id === value);
              const a = Number(document.getElementById("scoreA")?.value || 0);
              const b = Number(document.getElementById("scoreB")?.value || 0);
              await submitScore(m, a, b);
            }

            if (action === "confirmScore") {
              const m = state.matches.find(x => x.id === value);
              await confirmScore(m);
            }

            if (action === "disputeScore") {
              const m = state.matches.find(x => x.id === value);
              await disputeScore(m);
            }

            if (action === "openTicket") {
  state.uiSupportActiveId = value;
  subscribeSupportMessages(value);
  render();

}






if (action === "openSupportThread") {
  const t = activeTournament();
  if (!t) return;
  subscribeAdminThread(t.id, value);
}



            if (action === "print") window.print();

          } catch (err) {
            toast(err?.message || "Action failed");
          }
/* COPY UPI */
if (action === "copyUpi") {
  const t = activeTournament();
  if (!t?.upi) return toast("UPI not available");

  navigator.clipboard.writeText(t.upi)
    .then(() => toast("UPI ID copied"))
    .catch(() => toast("Copy failed"));
}

/* OPEN UPI APP */
if (action === "openUPI") {
  const t = activeTournament();
  if (!t?.upi || !t?.entryFee) {
    toast("UPI not configured");
    return;
  }

  const upiUrl =
    `upi://pay?pa=${encodeURIComponent(t.upi)}` +
    `&pn=${encodeURIComponent(t.organizerName || "Organizer")}` +
    `&am=${encodeURIComponent(t.entryFee)}` +
    `&cu=INR&tn=Tournament Entry`;

  window.location.href = upiUrl;
}

if (action === "backSupportThreads") {
  const t = activeTournament();
  if (!t) return;
  state.uiSupportActiveId = null;
  state.uiSupportMessages = [];
  state.uiSupportAdminView = "threads";
  // re-subscribe threads list
  subscribeSupportContext(t.id);
  render();
}

if (action === "setTournamentTab" && value === "Support") {
  const t = activeTournament();
  if (!t) return;

  // Admin should load thread list too
  subscribeSupportContext(t.id);

  // Player loads chat immediately
  if (!isAdmin(t)) subscribeSupportChat(t.id);

  render();
}


if (action === "sendSupport") {
  const t = activeTournament();
  if (!t) return;

  const input = document.getElementById("supportInput");
  const msg = input?.value?.trim();
  if (!msg) return;

  await sendSupportMessage(t.id, msg);
  input.value = "";
}



if (action === "resolveDispute") {
  const match = state.matches.find(m => m.id === el.dataset.mid);
  const guilty = el.dataset.guilty;

  const score = prompt("Enter final score (e.g. 2-1)");
  if (match && score) {
    resolveDispute(match, score, guilty);
  }
}



/* REJECT PARTICIPANT */
if (action === "rejectParticipant") {
  await updateDoc(doc(db, "participants", value), {
    status: "rejected",
    paymentStatus: "REJECTED",
    rejectedAt: now()
  });
  toast("Payment rejected");
}


        };
      });
    }
 

    // Initial render
    render();

    // Safety: if activeTournament changes while logged in, resubscribe
    // (handled inside enterTournament / exitTournament)

  </script>
</body>
</html>
